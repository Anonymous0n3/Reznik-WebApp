services:
  webapp:
    build:
      context: . 
      dockerfile: Reznik-WebApp.Server/Dockerfile 
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Database=ReznikDb;Username=admin;Password=secretpassword
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080 # Přidáno, aby aplikace věděla, že má poslouchat pro Caddy na 8080
    depends_on:
      - postgres-db
    volumes: 
      - ./wwwroot/uploads:/app/wwwroot/uploads 
      # ./https:/https/ jsme smazali, protože certifikáty teď řeší Caddy, ne aplikace

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      #- "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - webapp

  postgres-db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: ReznikDb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

# TADY byla ta chyba - musíme definovat všechny pojmenované volumes pro celý projekt
volumes:
  pg_data:
  caddy_data:
  caddy_config: